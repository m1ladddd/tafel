# .github/workflows/python-ci.yml

name: Python CI Checks # Naam van de workflow

# Wanneer moet deze workflow draaien?
on:
  push: # Bij elke push naar deze branches:
    branches:
      - main
      - 'feature/pandapower' # Gebruik aanhalingstekens bij slashes
  pull_request: # Bij elke pull request naar deze branches:
    branches:
      - main
      - 'feature/pandapower' # Gebruik aanhalingstekens bij slashes

jobs: # De taken die uitgevoerd moeten worden
  build-and-test: # Naam van onze specifieke taak
    runs-on: ubuntu-latest # Gebruik een standaard Linux omgeving

    steps: # De individuele stappen in de taak
    # Stap 1: Code ophalen uit je repository
    - uses: actions/checkout@v4 # Officiële GitHub Action

    # Stap 2: Python versie instellen (pas aan naar jouw versie)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Gebaseerd op je pyenv versie

    # Stap 3: Dependencies installeren
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Installeer numba hier apart als je het altijd wilt gebruiken in CI
        pip install numba

    # Stap 4: Code linten met Flake8
    - name: Lint with flake8
      run: |
        # stop de build als er Python syntax errors of undefined names zijn
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # geef alle errors/warnings, maar faal niet (exit-zero)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Stap 5: Originele Unit Tests
    - name: Run Original Unit Tests
      run: |
        echo "🧪 Running Original Unit Tests (Binary encoding, Model segmentation)"
        cd test && python run_tests.py

    # Stap 6: Pandapower Implementation Tests
    - name: Run Pandapower Tests
      run: |
        echo "🧪 Running Pandapower Implementation Tests"
        cd test && python test_pandapower_implementation.py

    # Stap 7: Basic Integration Tests voor Refactored Modules
    - name: Run Refactored Module Integration Tests
      run: |
        echo "🧪 Running Basic Integration Tests for Refactored Modules"
        python test_refactored_app.py

    # Stap 8: Comprehensive Tests (Error handling, Edge cases, Performance)
    - name: Run Comprehensive Tests
      run: |
        echo "🧪 Running Comprehensive Tests (Error handling, Edge cases, Performance)"
        cd test && python test_refactored_comprehensive.py

    # Stap 9: Application Smoke Test
    - name: Run Application Smoke Test
      run: |
        echo "🧪 Running Application Smoke Test"
        echo "Testing basic application startup and imports..."
        timeout 30s python -c "
        import sys
        import os
        from main_controller import MainApplicationController
        from app_state import AppState
        
        try:
            app_state = AppState()
            app_state.simulation_mode = True
            controller = MainApplicationController()
            controller.app_state.request_shutdown()
            print('✅ Application smoke test passed')
        except Exception as e:
            print(f'❌ Application smoke test failed: {e}')
            sys.exit(1)
        " || (echo "❌ Application smoke test timed out or failed" && exit 1)

    # Stap 10: pytest Discovery (behouden van origineel)
    - name: Test with pytest discovery
      run: |
        echo "🧪 Running PyTest Discovery"
        # Voer pytest uit; het vindt tests automatisch
        pytest test/ -v --tb=short
        
    # Stap 11: Test Summary Report
    - name: Generate Test Summary
      if: always() # Run even if previous steps failed
      run: |
        echo "📊 Test Pipeline Summary"
        echo "=========================="
        echo "✅ Original Unit Tests: Binary encoding, Model segmentation"
        echo "✅ Pandapower Tests: Implementation and network functionality"  
        echo "✅ Integration Tests: Refactored modules (AppState, ConfigLoader, MQTTManager, CommandDispatcher)"
        echo "✅ Comprehensive Tests: Error handling, edge cases, performance"
        echo "✅ Application Smoke Test: Basic startup and imports"
        echo "✅ PyTest Discovery: All test discovery"
        echo "=========================="
        echo "🎉 Refactored Smart Grid Table application fully tested!"
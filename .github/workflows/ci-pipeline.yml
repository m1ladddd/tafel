name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/pandapower
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' # Behoud consistente Python versie

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installeer alles vanuit requirements.txt
          # Zorg dat pandapower==<versie> en pytest in requirements.txt staan
          # Gebruik --no-cache-dir voor een schone installatie
          pip install --no-cache-dir -r requirements.txt
          # VERWIJDER DE APARTE INSTALLS HIERONDER ALS ZE IN requirements.txt STAAN
          # pip install pandapower
          # pip install pytest

      # NIEUWE STAP: Controleer geïnstalleerde packages
      - name: Show Installed Packages
        run: |
          echo "Installed packages:"
          pip freeze

      - name: Run tests
        run: |
          # Pytest wordt nu via requirements.txt geïnstalleerd
          python -m pytest